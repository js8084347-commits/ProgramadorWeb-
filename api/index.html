<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        body {
            background-color: blanchedalmond;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }

        button {
            background-color: azure;
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>

    <script>
        function gerar() {
            fetch("https://dog.ceo/api/breeds/image/random")
            .then(res => res.json())
            .then(data => {
                document.getElementById("foto").src = data.message;
            });
        }
    </script>

    <h1>Gerador de Imagens de Cachorros</h1>
    <img id="foto" width="300">
    <button onclick="gerar()">Gerar Cachorro </button>
</body>
</html>
